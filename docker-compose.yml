services:
  home-wol:
    build:
      context: .
      dockerfile: Dockerfile
    image: registry.cn-hangzhou.aliyuncs.com/chldemo/home-wol:v1.2
    container_name: home-wol
    restart: unless-stopped
    # Linux 软路由使用宿主机网络发送局域网 WOL 广播。
    # 应用直接监听宿主机 1323 端口，host 模式无需 ports 映射。
    network_mode: host
    volumes:
      # Web 管理界面需要写入配置；宿主机文件必须提前存在。
      - type: bind
        source: ./config.json
        target: ${CONFIG_PATH:-/home/config.json}
        read_only: false
        bind:
          create_host_path: false
    environment:
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:?请在 .env 中设置管理端登录密码 ADMIN_PASSWORD}
      # 配置文件路径
      - CONFIG_PATH=${CONFIG_PATH:-/home/config.json}
      # 仅兼容旧环境变量；页面保存到 config.json 的广播地址优先。
      - BROADCAST_ADDRESS=${BROADCAST_ADDRESS:-}
      # 时区设置
      - TZ=${TZ:-Asia/Shanghai}
    # 健康检查
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "-O", "/dev/null", "http://127.0.0.1:1323/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    # 日志配置
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    # 资源限制（可选）
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M
        reservations:
          cpus: '0.25'
          memory: 64M
